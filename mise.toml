# One toolchain for developers, git hooks and CI: `mise install`, then `mise run check`.
[tools]
node = "24.18.1"
hk = "2.12.0"
pkl = "0.33.0"
betterleaks = "1.10.1"
jactionlint = "2.6.0"
lychee = "0.24.2"
osv-scanner = "2.7.1"
rumdl = "0.3.4"
typos = "1.52.2"
"github:agent-sh/agnix" = "0.61.0"

[tasks.setup]
description = "Install dependencies and the git hooks"
run = ["npm ci", "hk install"]

[tasks.check]
description = "Run every check, the same set CI runs"
run = "hk check --all"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"

[tasks.audit]
description = "Scan the lockfile for known vulnerabilities (also runs on a schedule in CI)"
run = "osv-scanner scan source --lockfile package-lock.json"
